x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stentor
      POSTGRES_USER: stentor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stentor}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stentor -d stentor"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    logging: *default-logging
    stop_grace_period: 30s
    mem_limit: 512m

  bot:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://stentor:${POSTGRES_PASSWORD:-stentor}@postgres:5432/stentor
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=384
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    logging: *default-logging
    stop_grace_period: 30s
    mem_limit: 512m

volumes:
  postgres-data:
